# Example spec for medium-imager: "How We Cut Latency by 80%"
# 
# This spec demonstrates all supported image types and themes.
# Copy this file to customize for your own article.
#
# Modes:
#   - Manual: uv run python -m engine.render --spec this_spec.yaml
#   - Preview: uv run python -m engine.render --spec this_spec.yaml --only cover
#   - Spec only: uv run python -m engine.render --spec this_spec.yaml --spec-only

meta:
  title: "How We Cut Latency by 80%"
  slug: "latency-optimization"
  theme: "clean_minimal"
  cover:
    subtitle: "Edge-first architecture delivers 5x performance gains"
    ratio: "wide"

images:
  # 1. Section divider to mark "The Problem"
  - type: section_divider
    label: "The Problem"

  # 2. Quote block: showcase a customer pain point
  - type: quote_block
    quote: "We were losing customers in Asia-Pacific due to 2+ second response times. This wasn't a feature problem—it was a geography problem."
    attribution: "Sarah Chen, VP Infrastructure"

  # 3. Stat callout: the main win
  - type: stat_callout
    value: "160ms"
    label: "Median p99 Latency"
    context: "Down from 800ms (5x improvement)"

  # 4. Stat callout: cache performance
  - type: stat_callout
    value: "94%"
    label: "Cache Hit Rate"
    context: "Up from just 12%"

  # 5. Section divider to mark "Solution"
  - type: section_divider
    label: "Edge-First Caching"

  # 6. Linear flow: the 3-tier caching strategy
  - type: linear_flow
    steps:
      - "1ms in-memory local cache"
      - "Regional Redis clusters (6 regions)"
      - "CloudFlare global CDN"

  # 7. Code card: implementation example
  - type: code_card
    code: |
      def cached_fetch(key, ttl=3600):
          local = local_cache.get(key)
          if local: return local
          
          regional = redis_pool.get(f"region:{region_id}:{key}")
          if regional:
              local_cache.set(key, regional, ttl)
              return regional
          
          result = db.query(key)
          redis_pool.set(f"region:{region_id}:{key}", result, ttl)
          return result
    language: python

  # 8. Comparison table: before vs after metrics
  - type: comparison_table
    title_left: "Before"
    title_right: "After"
    rows:
      - ["p99 Latency", "800ms", "160ms"]
      - ["Cache Hit Rate", "12%", "94%"]
      - ["DB Query Load", "100%", "28%"]
      - ["Global Regions", "3", "6"]
      - ["Cost per Month", "$50k", "$36k"]

  # 9. Branch 2-way: diverging approaches
  - type: branch_2way
    left_label: "Old: Centralized"
    right_label: "New: Edge-First"
    left_items:
      - "Single central database"
      - "High latency for distant users"
      - "Expensive scaling"
      - "Regional failures cascade"
    right_items:
      - "Distributed edge caching"
      - "Sub-200ms anywhere"
      - "Cost-efficient redundancy"
      - "Graceful regional fallback"

  # 10. Stage cycle: next steps roadmap
  - type: stage_cycle
    stages:
      - "Predictive prefetching"
      - "Per-type cache invalidation"
      - "Auto fallback routing"

  # 11. Stat callout: cost savings
  - type: stat_callout
    value: "28%"
    label: "Infrastructure Cost Reduction"
    context: "While improving performance and global availability"

  # 12. Section divider to close
  - type: section_divider
    label: "The Edge-First Mentality"
