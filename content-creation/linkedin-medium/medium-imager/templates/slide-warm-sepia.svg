<?xml version="1.0" encoding="UTF-8"?>
<!-- THEME: Warm sepia. Shared slide canvas for quote / callout / stat /
     code image types. Canvas 1600x900, MARGIN 110, FOOTER_BAND 120.
     Placeholders: CONTENT_BLOCK, FOOTER, COUNTER, INDEX, TOTAL. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>
    .quote-mark { fill: #9c6b3f; font-size: 140px; font-family: Georgia, 'Times New Roman', serif; }
    .quote { fill: #4a3728; font-weight: 700; font-style: italic; font-family: Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif; }
    .attribution { fill: #7a6248; font-weight: 400; font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; }
    .label { fill: #9c6b3f; font-weight: 700; letter-spacing: 2px; font-family: Georgia, 'Times New Roman', serif; }
    .callout-text { fill: #4a3728; font-weight: 700; font-family: Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif; }
    .stat-number { fill: #9c6b3f; font-weight: 800; font-family: Georgia, 'Times New Roman', serif; }
    .stat-label { fill: #7a6248; font-weight: 400; font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; }
    .lang-badge-bg { fill: #9c6b3f; }
    .lang-badge { fill: #f0e2c8; font-weight: 700; letter-spacing: 1px; font-family: Georgia, 'Times New Roman', serif; }
    .code { fill: #4a3728; font-family: 'Courier New', 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
    .footer { fill: #9c8468; font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; font-size: 26px; letter-spacing: 0.5px; }
    .counter { fill: #9c8468; font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; font-size: 26px; }
  </style>
  <rect width="1600" height="900" fill="#f0e2c8"/>
  <rect x="110" y="110" width="160" height="8" fill="#9c6b3f"/>
  {{CONTENT_BLOCK}}
  <text x="110" y="832" class="footer">{{FOOTER}}</text>
  <text x="1490" y="832" text-anchor="end" class="counter">{{COUNTER}}</text>
</svg>
