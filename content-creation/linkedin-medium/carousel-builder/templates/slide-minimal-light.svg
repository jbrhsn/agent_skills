<?xml version="1.0" encoding="UTF-8"?>
<!-- THEME: Minimal light — clean editorial white slide with a single accent
     rule. Serif title/body, uppercase footer. Canvas 1080x1350, MARGIN 100,
     FOOTER_BAND 140. Placeholders: TITLE_BLOCK, BODY_BLOCK, FOOTER, COUNTER,
     INDEX, TOTAL. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <style>
    .title { fill: #111111; font-weight: 700; letter-spacing: -0.5px; font-family: Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif; }
    .body  { fill: #444444; font-weight: 400; font-family: Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif; }
    .footer { fill: #999999; font-family: Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; font-size: 26px; letter-spacing: 1px; }
  </style>
  <rect width="1080" height="1350" fill="#fafafa"/>
  <rect x="100" y="100" width="200" height="6" fill="#111111"/>
  {{TITLE_BLOCK}}
  {{BODY_BLOCK}}
  <text x="100" y="1270" class="footer">{{FOOTER}}</text>
  <text x="980" y="1270" text-anchor="end" class="footer">{{COUNTER}}</text>
</svg>
