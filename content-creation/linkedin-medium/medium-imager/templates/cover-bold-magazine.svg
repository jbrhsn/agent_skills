<?xml version="1.0" encoding="UTF-8"?>
<!-- THEME: Bold magazine. Pure white/black high-contrast sans-serif, thick
     rule accents. Canvas 1500x750, MARGIN 90, FOOTER_BAND 90.
     Placeholders: TITLE_BLOCK, SUBTITLE_BLOCK, FOOTER. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="750" viewBox="0 0 1500 750">
  <style>
    .title { fill: #000000; font-weight: 800; letter-spacing: -1px; font-family: Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; }
    .subtitle { fill: #000000; font-weight: 400; font-family: Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; }
    .footer { fill: #000000; font-family: Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: 1px; }
  </style>
  <rect width="1500" height="750" fill="#ffffff"/>
  <rect x="0" y="0" width="1500" height="24" fill="#000000"/>
  <rect x="90" y="90" width="240" height="16" fill="#ff3b30"/>
  {{TITLE_BLOCK}}
  {{SUBTITLE_BLOCK}}
  <line x1="90" y1="650" x2="1410" y2="650" stroke="#000000" stroke-width="4"/>
  <text x="90" y="694" class="footer">{{FOOTER}}</text>
</svg>
