<?xml version="1.0" encoding="UTF-8"?>
<!-- THEME: Clean minimal (default). Shared slide canvas for quote / callout
     / stat / code image types. Canvas 1600x900, MARGIN 110, FOOTER_BAND 120.
     Placeholders: CONTENT_BLOCK, FOOTER, COUNTER, INDEX, TOTAL.
     Content-block class names filled by scripts/render_svg.py per type:
     quote-mark/quote/attribution, label/callout-text, stat-number/stat-label,
     lang-badge/code. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>
    .quote-mark { fill: #2563eb; font-size: 140px; font-family: Georgia, 'Times New Roman', serif; }
    .quote { fill: #1a1a1a; font-weight: 700; font-family: Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; }
    .attribution { fill: #5a5a5a; font-weight: 400; font-family: Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; }
    .label { fill: #2563eb; font-weight: 700; letter-spacing: 2px; font-family: Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; }
    .callout-text { fill: #1a1a1a; font-weight: 700; font-family: Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; }
    .stat-number { fill: #2563eb; font-weight: 800; font-family: Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; }
    .stat-label { fill: #5a5a5a; font-weight: 400; font-family: Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; }
    .lang-badge-bg { fill: #2563eb; }
    .lang-badge { fill: #ffffff; font-weight: 700; letter-spacing: 1px; font-family: Helvetica, Arial, sans-serif; }
    .code { fill: #1a1a1a; font-family: 'Courier New', 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
    .footer { fill: #9a9a9a; font-family: Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; font-size: 26px; letter-spacing: 0.5px; }
    .counter { fill: #9a9a9a; font-family: Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; font-size: 26px; }
  </style>
  <rect width="1600" height="900" fill="#f7f7f5"/>
  <rect x="110" y="110" width="140" height="10" fill="#2563eb"/>
  {{CONTENT_BLOCK}}
  <text x="110" y="832" class="footer">{{FOOTER}}</text>
  <text x="1490" y="832" text-anchor="end" class="counter">{{COUNTER}}</text>
</svg>
