<?xml version="1.0" encoding="UTF-8"?>
<!-- THEME: Editorial serif. Shared slide canvas for quote / callout / stat
     / code image types. Canvas 1600x900, MARGIN 110, FOOTER_BAND 120.
     Placeholders: CONTENT_BLOCK, FOOTER, COUNTER, INDEX, TOTAL. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>
    .quote-mark { fill: #1c1c1c; font-size: 140px; font-family: Georgia, 'Times New Roman', serif; }
    .quote { fill: #1c1c1c; font-weight: 700; font-style: italic; font-family: Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif; }
    .attribution { fill: #6a6a60; font-weight: 400; font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; }
    .label { fill: #8a6d3b; font-weight: 700; letter-spacing: 2px; font-family: Georgia, 'Times New Roman', serif; }
    .callout-text { fill: #1c1c1c; font-weight: 700; font-family: Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif; }
    .stat-number { fill: #8a6d3b; font-weight: 800; font-family: Georgia, 'Times New Roman', serif; }
    .stat-label { fill: #4a4a4a; font-weight: 400; font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; }
    .lang-badge-bg { fill: #1c1c1c; }
    .lang-badge { fill: #faf6ee; font-weight: 700; letter-spacing: 1px; font-family: Georgia, 'Times New Roman', serif; }
    .code { fill: #1c1c1c; font-family: 'Courier New', 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
    .footer { fill: #8a8a80; font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; font-size: 26px; letter-spacing: 1px; }
    .counter { fill: #8a8a80; font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; font-size: 26px; }
  </style>
  <rect width="1600" height="900" fill="#faf6ee"/>
  <rect x="110" y="110" width="200" height="4" fill="#1c1c1c"/>
  {{CONTENT_BLOCK}}
  <text x="110" y="832" class="footer">{{FOOTER}}</text>
  <text x="1490" y="832" text-anchor="end" class="counter">{{COUNTER}}</text>
</svg>
