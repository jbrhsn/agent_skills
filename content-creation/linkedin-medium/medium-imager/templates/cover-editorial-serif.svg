<?xml version="1.0" encoding="UTF-8"?>
<!-- THEME: Editorial serif. Cream background, Georgia/serif type, thin
     black accent rule. Canvas 1500x750, MARGIN 90, FOOTER_BAND 90.
     Placeholders: TITLE_BLOCK, SUBTITLE_BLOCK, FOOTER. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="750" viewBox="0 0 1500 750">
  <style>
    .title { fill: #1c1c1c; font-weight: 700; font-family: Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif; }
    .subtitle { fill: #4a4a4a; font-weight: 400; font-style: italic; font-family: Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif; }
    .footer { fill: #8a8a80; font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; font-size: 26px; letter-spacing: 1px; }
  </style>
  <rect width="1500" height="750" fill="#faf6ee"/>
  <rect x="90" y="90" width="200" height="4" fill="#1c1c1c"/>
  {{TITLE_BLOCK}}
  {{SUBTITLE_BLOCK}}
  <text x="90" y="682" class="footer">{{FOOTER}}</text>
</svg>
