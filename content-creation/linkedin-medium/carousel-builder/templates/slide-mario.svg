<?xml version="1.0" encoding="UTF-8"?>
<!-- THEME: Super Mario — bright sky blue, question-block gold accent, brick
     footer, chunky playful type. Canvas 1080x1350, MARGIN 100, FOOTER_BAND 140.
     Placeholders: TITLE_BLOCK, BODY_BLOCK, FOOTER, COUNTER, INDEX, TOTAL. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <pattern id="mario-brick" width="90" height="44" patternUnits="userSpaceOnUse">
      <rect width="90" height="44" fill="#c84c0c"/>
      <path d="M 0 4 L 90 4 M 0 44 L 90 44 M 4 4 L 4 44 M 90 4 L 90 44" stroke="#000000" stroke-opacity="0.13" stroke-width="4" fill="none"/>
    </pattern>
  </defs>
  <style>
    .title { fill: #e52521; font-weight: 900; font-family: 'Trebuchet MS', Helvetica, Arial, 'DejaVu Sans', sans-serif; }
    .body  { fill: #ffffff; font-weight: 700; font-family: 'Trebuchet MS', Helvetica, Arial, 'DejaVu Sans', sans-serif; }
    .footer { fill: #ffffff; font-family: 'Trebuchet MS', Helvetica, Arial, 'DejaVu Sans', sans-serif; font-size: 30px; font-weight: 800; }
  </style>
  <rect width="1080" height="1350" fill="#5c94fc"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="720" cy="130" rx="70" ry="45"/>
    <ellipse cx="800" cy="115" rx="80" ry="50"/>
    <ellipse cx="880" cy="140" rx="65" ry="42"/>
  </g>
  <!-- Question block accent (gold, black-bordered) -->
  <g>
    <rect x="100" y="100" width="96" height="96" rx="12" ry="12" fill="#f8b800" stroke="#000000" stroke-width="6"/>
    <rect x="112" y="112" width="72" height="72" rx="6" ry="6" fill="none" stroke="#e39b00" stroke-width="6"/>
    <text x="148" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="900" fill="#ffffff" stroke="#000000" stroke-width="2">?</text>
  </g>
  {{TITLE_BLOCK}}
  {{BODY_BLOCK}}
  <!-- Brick footer band (bottom 120px). -->
  <rect x="0" y="1230" width="1080" height="120" fill="url(#mario-brick)"/>
  <rect x="0" y="1222" width="1080" height="8" fill="#000000"/>
  <text x="100" y="1298" class="footer">{{FOOTER}}</text>
  <text x="980" y="1298" text-anchor="end" class="footer">{{COUNTER}}</text>
</svg>
