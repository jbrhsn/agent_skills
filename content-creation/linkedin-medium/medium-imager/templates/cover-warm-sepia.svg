<?xml version="1.0" encoding="UTF-8"?>
<!-- THEME: Warm sepia. Warm tan/sepia background, soft brown accent, serif
     italics. Canvas 1500x750, MARGIN 90, FOOTER_BAND 90.
     Placeholders: TITLE_BLOCK, SUBTITLE_BLOCK, FOOTER. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="750" viewBox="0 0 1500 750">
  <style>
    .title { fill: #4a3728; font-weight: 700; font-family: Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif; }
    .subtitle { fill: #7a6248; font-weight: 400; font-style: italic; font-family: Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif; }
    .footer { fill: #9c8468; font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; font-size: 26px; letter-spacing: 0.5px; }
  </style>
  <rect width="1500" height="750" fill="#f0e2c8"/>
  <rect x="90" y="90" width="160" height="8" fill="#9c6b3f"/>
  {{TITLE_BLOCK}}
  {{SUBTITLE_BLOCK}}
  <text x="90" y="682" class="footer">{{FOOTER}}</text>
</svg>
