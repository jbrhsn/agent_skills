<?xml version="1.0" encoding="UTF-8"?>
<!-- THEME: Default (dark slate). Canvas + geometry in sync with
     scripts/render_svg.py: 1080x1350, MARGIN 100, FOOTER_BAND 140.
     Placeholders: TITLE_BLOCK, BODY_BLOCK, FOOTER, COUNTER, INDEX, TOTAL. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <style>
    .title { fill: #f8fafc; font-weight: 700; font-family: Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; }
    .body  { fill: #cbd5e1; font-weight: 400; font-family: Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; }
    .footer { fill: #64748b; font-family: Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; font-size: 28px; }
  </style>
  <rect width="1080" height="1350" fill="#0f172a"/>
  <rect x="100" y="100" width="120" height="10" fill="#38bdf8"/>
  {{TITLE_BLOCK}}
  {{BODY_BLOCK}}
  <text x="100" y="1270" class="footer">{{FOOTER}}</text>
  <text x="980" y="1270" text-anchor="end" class="footer">{{COUNTER}}</text>
</svg>
