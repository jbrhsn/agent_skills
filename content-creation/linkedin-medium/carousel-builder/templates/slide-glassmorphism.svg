<?xml version="1.0" encoding="UTF-8"?>
<!-- THEME: Glassmorphism — frosted translucent card over a colorful blurred
     gradient. Canvas 1080x1350, MARGIN 100, FOOTER_BAND 140. Placeholders:
     TITLE_BLOCK, BODY_BLOCK, FOOTER, COUNTER, INDEX, TOTAL.
     Note: SVG lacks backdrop-filter; the "frost" is approximated with a
     semi-opaque white card layered over feGaussianBlur'd backdrop shapes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="glass-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glass-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glass-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>
  <style>
    .title { fill: #ffffff; font-weight: 800; letter-spacing: -0.5px; font-family: Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; }
    .body  { fill: #ffffff; fill-opacity: 0.88; font-weight: 400; font-family: Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; }
    .footer { fill: #ffffff; fill-opacity: 0.65; font-family: Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; font-size: 28px; }
  </style>
  <rect width="1080" height="1350" fill="url(#glass-bg)"/>
  <g filter="url(#glass-blur)" opacity="0.85">
    <circle cx="216" cy="203" r="260" fill="#7c3aed"/>
    <circle cx="918" cy="338" r="230" fill="#06b6d4"/>
    <circle cx="756" cy="1215" r="260" fill="#ec4899"/>
  </g>
  <rect x="60" y="60" width="960" height="1230" rx="40" ry="40" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="100" y="100" width="120" height="10" rx="5" ry="5" fill="url(#glass-accent)"/>
  {{TITLE_BLOCK}}
  {{BODY_BLOCK}}
  <text x="100" y="1270" class="footer">{{FOOTER}}</text>
  <text x="980" y="1270" text-anchor="end" class="footer">{{COUNTER}}</text>
</svg>
