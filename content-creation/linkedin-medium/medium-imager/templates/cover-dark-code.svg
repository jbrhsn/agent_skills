<?xml version="1.0" encoding="UTF-8"?>
<!-- THEME: Dark code. Near-black background, monospace/terminal accents,
     green highlight. Canvas 1500x750, MARGIN 90, FOOTER_BAND 90.
     Placeholders: TITLE_BLOCK, SUBTITLE_BLOCK, FOOTER. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="750" viewBox="0 0 1500 750">
  <style>
    .title { fill: #e6edf3; font-weight: 700; font-family: 'Courier New', 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
    .subtitle { fill: #8b949e; font-weight: 400; font-family: 'Courier New', 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
    .footer { fill: #3fb950; font-family: 'Courier New', 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 26px; }
  </style>
  <rect width="1500" height="750" fill="#0d1117"/>
  <rect x="90" y="90" width="140" height="10" fill="#3fb950"/>
  {{TITLE_BLOCK}}
  {{SUBTITLE_BLOCK}}
  <text x="90" y="682" class="footer">{{FOOTER}}</text>
</svg>
