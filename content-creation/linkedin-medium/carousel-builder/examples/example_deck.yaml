meta:
  title: "Ship Your First Side Project"
  slug: ship-first-side-project
  format: portrait          # square | portrait | landscape
  theme: dark_navy          # a name in themes/, or a path to a custom theme .json
  footer: "@yourhandle"

slides:
  - type: title
    kicker: "A field guide"
    headline: "Ship Your First Side Project in a Weekend"
    subheadline: "Not another tutorial. A repeatable system for going from idea to live URL."

  - type: comparison
    heading: "The mindset shift that changes everything"
    title_left: "What beginners chase"
    title_right: "What shippers do"
    items_left:
      - "The perfect tech stack"
      - "Every feature up front"
      - "A polished design first"
      - "Approval before starting"
    items_right:
      - "Tools they already know"
      - "One core feature only"
      - "Ugly but working v1"
      - "Permission from nobody"

  - type: stat_grid
    heading: "Where weekend projects actually die"
    primary:
      label: "Scope creep"
      value: "61%"
      detail: "Never shipped because it kept growing"
    secondary:
      - {label: "Lost motivation", value: "18%"}
      - {label: "Tech rabbit holes", value: "12%"}
      - {label: "Fear of launch", value: "9%"}

  - type: numbered_phase
    number: "01"
    title: "Cut the idea in half. Then half again."
    body: "Your first version should feel almost embarrassingly small. If you can't build it in one sitting, it is still too big."
    icon: "target"
    callout_label: "The action"
    callout_body: "Write one sentence: 'It lets someone ___.' Delete everything that isn't that."

  - type: process_loop
    heading: "The weekend shipping loop"
    steps:
      - {label: "Build", detail: "One tiny slice, end to end"}
      - {label: "Ship", detail: "Push it live, however rough"}
      - {label: "Share", detail: "Tell exactly one person"}
      - {label: "Learn", detail: "Watch what they actually do"}

  - type: list_steps
    heading: "Your Saturday-morning checklist"
    style: check
    items:
      - "Pick a stack you already know"
      - "Create the repo before coffee is done"
      - "Deploy an empty page first"
      - "Build only the one core action"
      - "Put a real URL in front of a human"

  - type: quote
    quote: "You do not rise to the level of your ideas. You fall to the level of the smallest thing you are willing to ship."
    attribution: "Every shipper, eventually"

  - type: cta
    headline: "Your idea deserves a URL, not a folder."
    subtext: "Save this, then block two hours this weekend. That's the whole plan."
    action: "Follow for more"
