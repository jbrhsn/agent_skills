[project]
name = "medium-imager"
version = "2.0.0"
description = "Local Medium article image generator: cover + in-article images (quote/stat/callout/code/diagram/section-divider/comparison-table) rendered via headless Chromium (Playwright) with Jinja2 templates, Pygments syntax highlighting, and JSON theme tokens. No image APIs or models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.44",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "markdown-it-py>=3.0",
    "pygments>=2.16",
]

[project.scripts]
medium-render = "engine.render:main"

[tool.uv]
package = false
