<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carousel Slide {{INDEX}}/{{TOTAL}} — Super Mario</title>
<style>
  /* THEME: Super Mario — bright sky blue, question-block gold accents, brick
     footer, chunky playful type. Canvas + geometry in sync with
     scripts/render_svg.py: 1080x1350, MARGIN 100, FOOTER_BAND 140.
     Placeholders: {{TITLE}} {{BODY}} {{FOOTER}} {{INDEX}} {{TOTAL}}. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #5c94fc; }
  .slide {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    color: #1b1b1b;
    font-family: "Comic Sans MS", "Trebuchet MS", Helvetica, Arial, "DejaVu Sans", sans-serif;
    padding: 100px 100px 140px 100px; /* bottom == FOOTER_BAND */
    display: flex;
    flex-direction: column;
    /* classic NES-Mario sky */
    background: #5c94fc;
  }
  /* rolling clouds hint */
  .slide::before {
    content: ""; position: absolute; top: 40px; right: 60px;
    width: 220px; height: 90px; border-radius: 60px;
    background: #ffffff;
    box-shadow: -140px 30px 0 -10px #ffffff, 120px 20px 0 -20px #ffffff;
    opacity: 0.9;
  }
  /* question block accent */
  .accent {
    position: relative; width: 96px; height: 96px; border-radius: 12px;
    background: #f8b800; border: 6px solid #000000;
    margin-bottom: 44px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 6px #e39b00;
  }
  .accent::after {
    content: "?"; color: #ffffff; font-weight: 900; font-size: 56px;
    text-shadow: 2px 2px 0 #000000;
  }
  .content { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .title {
    font-size: 68px; font-weight: 900; line-height: 1.14;
    color: #e52521; /* Mario red */
    text-shadow: 3px 3px 0 #000000, 6px 6px 0 rgba(0,0,0,0.25);
  }
  .body {
    font-size: 40px; font-weight: 700; line-height: 1.4;
    color: #ffffff; margin-top: 56px; white-space: pre-wrap;
    text-shadow: 2px 2px 0 #1b1b1b;
  }
  /* brick-strip footer band */
  .footer {
    position: absolute; left: 0; right: 0; bottom: 0; height: 120px;
    padding: 0 100px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 30px; font-weight: 800; color: #ffffff;
    background: #c84c0c;
    border-top: 8px solid #000000;
    background-image:
      linear-gradient(#00000022 4px, transparent 4px),
      linear-gradient(90deg, #00000022 4px, transparent 4px);
    background-size: 90px 44px;
    text-shadow: 2px 2px 0 #000000;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="accent"></div>
    <div class="content">
      <h1 class="title">{{TITLE}}</h1>
      <p class="body">{{BODY}}</p>
    </div>
    <div class="footer">
      <span class="footer-handle">{{FOOTER}}</span>
      <span class="footer-counter">{{INDEX}}/{{TOTAL}}</span>
    </div>
  </div>
</body>
</html>
