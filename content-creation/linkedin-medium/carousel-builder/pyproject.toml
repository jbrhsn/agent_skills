[project]
name = "carousel-builder"
version = "1.0.0"
description = "Local LinkedIn carousel generator: typed deck spec + JSON theme tokens rendered via headless Chromium (Playwright) to PNG, auto-merged to PDF. No image APIs or models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.44",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "img2pdf>=0.5",
]

[project.scripts]
carousel-render = "engine.render:main"

[tool.uv]
package = false
