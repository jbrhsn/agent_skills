<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
{{ font_face_css }}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #000; }

:root {
  --bg: {{ colors.background }};
  --surface: {{ colors.surface }};
  --text: {{ colors.text_primary }};
  --text2: {{ colors.text_secondary }};
  --pos: {{ colors.accent_positive }};
  --neg: {{ colors.accent_negative }};
  --neutral: {{ colors.accent_neutral }};
  --font-head: '{{ fonts.heading }}', sans-serif;
  --font-body: '{{ fonts.body }}', sans-serif;
  --w-head: {{ fonts.heading_weight }};
  --w-body: {{ fonts.body_weight }};
  --radius: {{ decoration.corner_radius | default(12) }}px;
  --canvas-w: {{ canvas.width }}px;
  --canvas-h: {{ canvas.height }}px;
  --margin: {{ canvas.margin }}px;
  --fit: 1;
}

#canvas {
  width: var(--canvas-w);
  height: var(--canvas-h);
  position: relative;
  overflow: hidden;
  {% if decoration.gradient and decoration.gradient|length >= 2 %}
  background: linear-gradient(135deg, {{ decoration.gradient | join(', ') }});
  {% else %}
  background: var(--bg);
  {% endif %}
  color: var(--text);
  font-family: var(--font-body);
  font-weight: var(--w-body);
}

.pad {
  position: absolute;
  inset: var(--margin);
  display: flex;
  flex-direction: column;
}

h1, h2, .head { font-family: var(--font-head); font-weight: var(--w-head); line-height: 1.08; }
.body-text { font-family: var(--font-body); font-weight: var(--w-body); color: var(--text2); }

.accent-bar {
  width: 96px; height: 12px; border-radius: 6px;
  {% if decoration.gradient_bar %}
  background: linear-gradient(90deg, var(--pos), var(--neg));
  {% else %}
  background: var(--pos);
  {% endif %}
}

.kicker {
  font-family: var(--font-head); font-weight: var(--w-head);
  text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--pos); font-size: 30px;
}

.footer-row {
  position: absolute; left: var(--margin); right: var(--margin); bottom: var(--margin);
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--font-body); color: var(--neutral); font-size: 28px;
}

.icon { display: inline-flex; }
.icon svg { width: 1em; height: 1em; display: block; }

{% block style %}{% endblock %}
</style>
</head>
<body>
<div id="canvas">
  {% block content %}{% endblock %}
  <div class="footer-row">
    <span>{{ footer }}</span>
    <span>{{ counter }}</span>
  </div>
</div>
</body>
</html>
