<?xml version="1.0" encoding="UTF-8"?>
<!-- THEME: Bold magazine. Shared slide canvas for quote / callout / stat /
     code image types. Canvas 1600x900, MARGIN 110, FOOTER_BAND 120.
     Placeholders: CONTENT_BLOCK, FOOTER, COUNTER, INDEX, TOTAL. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>
    .quote-mark { fill: #ff3b30; font-size: 160px; font-family: Helvetica, Arial, sans-serif; }
    .quote { fill: #000000; font-weight: 800; letter-spacing: -0.5px; font-family: Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; }
    .attribution { fill: #000000; font-weight: 400; font-family: Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; }
    .label { fill: #ff3b30; font-weight: 800; letter-spacing: 2px; font-family: Helvetica, Arial, sans-serif; }
    .callout-text { fill: #000000; font-weight: 800; font-family: Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; }
    .stat-number { fill: #ff3b30; font-weight: 900; font-family: Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; }
    .stat-label { fill: #000000; font-weight: 700; font-family: Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; }
    .lang-badge-bg { fill: #000000; }
    .lang-badge { fill: #ffffff; font-weight: 800; letter-spacing: 1px; font-family: Helvetica, Arial, sans-serif; }
    .code { fill: #000000; font-family: 'Courier New', 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
    .footer { fill: #000000; font-family: Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: 1px; }
    .counter { fill: #000000; font-family: Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; font-size: 28px; }
  </style>
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect x="0" y="0" width="1600" height="24" fill="#000000"/>
  <rect x="110" y="110" width="240" height="16" fill="#ff3b30"/>
  {{CONTENT_BLOCK}}
  <line x1="110" y1="800" x2="1490" y2="800" stroke="#000000" stroke-width="4"/>
  <text x="110" y="844" class="footer">{{FOOTER}}</text>
  <text x="1490" y="844" text-anchor="end" class="counter">{{COUNTER}}</text>
</svg>
