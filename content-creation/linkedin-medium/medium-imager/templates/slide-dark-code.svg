<?xml version="1.0" encoding="UTF-8"?>
<!-- THEME: Dark code. Shared slide canvas for quote / callout / stat / code
     image types. Canvas 1600x900, MARGIN 110, FOOTER_BAND 120.
     Placeholders: CONTENT_BLOCK, FOOTER, COUNTER, INDEX, TOTAL. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>
    .quote-mark { fill: #3fb950; font-size: 140px; font-family: 'Courier New', monospace; }
    .quote { fill: #e6edf3; font-weight: 700; font-family: 'Courier New', 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
    .attribution { fill: #8b949e; font-weight: 400; font-family: 'Courier New', 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
    .label { fill: #3fb950; font-weight: 700; letter-spacing: 2px; font-family: 'Courier New', monospace; }
    .callout-text { fill: #e6edf3; font-weight: 700; font-family: 'Courier New', 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
    .stat-number { fill: #3fb950; font-weight: 800; font-family: 'Courier New', 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
    .stat-label { fill: #8b949e; font-weight: 400; font-family: 'Courier New', 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
    .lang-badge-bg { fill: #3fb950; }
    .lang-badge { fill: #0d1117; font-weight: 700; letter-spacing: 1px; font-family: 'Courier New', monospace; }
    .code { fill: #e6edf3; font-family: 'Courier New', 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
    .footer { fill: #3fb950; font-family: 'Courier New', 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 26px; }
    .counter { fill: #8b949e; font-family: 'Courier New', 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 26px; }
  </style>
  <rect width="1600" height="900" fill="#0d1117"/>
  <rect x="110" y="110" width="140" height="10" fill="#3fb950"/>
  {{CONTENT_BLOCK}}
  <text x="110" y="832" class="footer">{{FOOTER}}</text>
  <text x="1490" y="832" text-anchor="end" class="counter">{{COUNTER}}</text>
</svg>
