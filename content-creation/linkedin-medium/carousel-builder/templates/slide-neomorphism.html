<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carousel Slide {{INDEX}}/{{TOTAL}} — Neomorphism</title>
<style>
  /* THEME: Neomorphism (soft UI) — monochrome surface with extruded, soft
     dual-shadow elements. Light, calm, tactile. Canvas + geometry in sync with
     scripts/render_svg.py: 1080x1350, MARGIN 100, FOOTER_BAND 140.
     Placeholders: TITLE, BODY, FOOTER, INDEX, TOTAL. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #e0e5ec; }
  .slide {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    background: #e0e5ec; /* the classic neomorphic base */
    color: #4b5563;
    font-family: Helvetica, "Helvetica Neue", Arial, "Liberation Sans", "DejaVu Sans", sans-serif;
    padding: 100px 100px 140px 100px; /* bottom == FOOTER_BAND */
    display: flex;
    flex-direction: column;
  }
  /* Extruded accent pill — raised via a light/dark shadow pair. */
  .accent {
    width: 140px; height: 22px; border-radius: 12px;
    background: #e0e5ec; margin-bottom: 48px; flex: 0 0 auto;
    box-shadow: 8px 8px 16px #b8bec7, -8px -8px 16px #ffffff;
  }
  .content { flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .title {
    font-size: 68px; font-weight: 800; line-height: 1.15;
    color: #374151;
    /* subtle embossed feel */
    text-shadow: 1px 1px 1px #ffffff, -1px -1px 1px #b8bec7;
  }
  .body {
    font-size: 40px; font-weight: 500; line-height: 1.4;
    color: #6b7280; margin-top: 60px; white-space: pre-wrap;
  }
  .footer {
    position: absolute; left: 100px; right: 100px; bottom: 80px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 28px; color: #9ca3af;
  }
  /* Inset counter chip — pressed-in soft shadow. */
  .footer-counter {
    padding: 10px 22px; border-radius: 16px; color: #6b7280;
    box-shadow: inset 4px 4px 8px #b8bec7, inset -4px -4px 8px #ffffff;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="accent"></div>
    <div class="content">
      <h1 class="title">{{TITLE}}</h1>
      <p class="body">{{BODY}}</p>
    </div>
    <div class="footer">
      <span class="footer-handle">{{FOOTER}}</span>
      <span class="footer-counter">{{INDEX}}/{{TOTAL}}</span>
    </div>
  </div>
</body>
</html>
