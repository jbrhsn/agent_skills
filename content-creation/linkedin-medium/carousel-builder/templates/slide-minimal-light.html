<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carousel Slide {{INDEX}}/{{TOTAL}} — Minimal Light</title>
<style>
  /* THEME: Minimal light — clean editorial white slide with a single accent
     rule. High-contrast, print-like, safe for any brand. Canvas + geometry in
     sync with scripts/render_svg.py: 1080x1350, MARGIN 100, FOOTER_BAND 140.
     Placeholders: TITLE, BODY, FOOTER, INDEX, TOTAL. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #eeeeee; }
  .slide {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    background: #fafafa;
    color: #111111;
    font-family: Georgia, "Times New Roman", "Liberation Serif", "DejaVu Serif", serif;
    padding: 100px 100px 140px 100px; /* bottom == FOOTER_BAND */
    display: flex;
    flex-direction: column;
  }
  .accent {
    width: 200px; height: 6px; background: #111111;
    margin-bottom: 48px; flex: 0 0 auto;
  }
  .content { flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .title {
    font-size: 68px; font-weight: 700; line-height: 1.14;
    color: #111111; letter-spacing: -0.5px;
  }
  .body {
    font-size: 40px; font-weight: 400; line-height: 1.5;
    color: #444444; margin-top: 60px; white-space: pre-wrap;
  }
  .footer {
    position: absolute; left: 100px; right: 100px; bottom: 80px;
    display: flex; justify-content: space-between;
    font-size: 26px; letter-spacing: 1px; text-transform: uppercase;
    color: #999999;
    font-family: Helvetica, Arial, "Liberation Sans", "DejaVu Sans", sans-serif;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="accent"></div>
    <div class="content">
      <h1 class="title">{{TITLE}}</h1>
      <p class="body">{{BODY}}</p>
    </div>
    <div class="footer">
      <span class="footer-handle">{{FOOTER}}</span>
      <span class="footer-counter">{{INDEX}}/{{TOTAL}}</span>
    </div>
  </div>
</body>
</html>
