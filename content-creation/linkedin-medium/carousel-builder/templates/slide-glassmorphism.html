<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carousel Slide {{INDEX}}/{{TOTAL}} — Glassmorphism</title>
<style>
  /* THEME: Glassmorphism — frosted translucent card over a colorful blurred
     gradient. Canvas + geometry kept in sync with scripts/render_svg.py:
     1080x1350, MARGIN 100, FOOTER_BAND 140. Placeholders: TITLE, BODY,
     FOOTER, INDEX, TOTAL. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0b1024; }
  .slide {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    font-family: Helvetica, "Helvetica Neue", Arial, "Liberation Sans", "DejaVu Sans", sans-serif;
    /* Vivid backdrop the glass sits on. */
    background:
      radial-gradient(circle at 20% 15%, #7c3aed 0%, transparent 45%),
      radial-gradient(circle at 85% 25%, #06b6d4 0%, transparent 40%),
      radial-gradient(circle at 70% 90%, #ec4899 0%, transparent 45%),
      linear-gradient(135deg, #0f172a, #1e1b4b);
  }
  /* Frosted glass panel inset from the canvas edge. */
  .glass {
    position: absolute;
    top: 60px; left: 60px; right: 60px; bottom: 60px;
    padding: 100px 100px 140px 100px; /* bottom == FOOTER_BAND */
    border-radius: 40px;
    background: rgba(255, 255, 255, 0.10);
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255,255,255,0.4);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .accent {
    width: 120px; height: 10px; border-radius: 6px;
    background: linear-gradient(90deg, #a78bfa, #22d3ee);
    margin-bottom: 40px; flex: 0 0 auto;
  }
  .content { flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .title {
    font-size: 68px; font-weight: 800; line-height: 1.15;
    color: #ffffff; letter-spacing: -0.5px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }
  .body {
    font-size: 40px; font-weight: 400; line-height: 1.4;
    color: rgba(255,255,255,0.88); margin-top: 60px; white-space: pre-wrap;
  }
  .footer {
    position: absolute; left: 100px; right: 100px; bottom: 80px;
    display: flex; justify-content: space-between;
    font-size: 28px; color: rgba(255,255,255,0.65);
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="glass">
      <div class="accent"></div>
      <div class="content">
        <h1 class="title">{{TITLE}}</h1>
        <p class="body">{{BODY}}</p>
      </div>
      <div class="footer">
        <span class="footer-handle">{{FOOTER}}</span>
        <span class="footer-counter">{{INDEX}}/{{TOTAL}}</span>
      </div>
    </div>
  </div>
</body>
</html>
